<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Discord Orb Collector</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      width: 300px;
      background: #1e2124;
      color: #dcddde;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: 13px;
      user-select: none;
    }

    /* ── Header ── */
    .header {
      background: #2c2f33;
      padding: 14px 16px 12px;
      border-bottom: 1px solid #111315;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .orb-icon {
      width: 28px; height: 28px;
      background: linear-gradient(135deg, #7289da 0%, #5b6ee1 50%, #a78cf0 100%);
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 15px;
      box-shadow: 0 0 10px rgba(114,137,218,.5);
      flex-shrink: 0;
    }
    .header-text { flex: 1; }
    .header-text h1 {
      font-size: 13px; font-weight: 700;
      color: #fff; letter-spacing: .3px;
    }
    .header-text p {
      font-size: 10px; color: #72767d; margin-top: 2px;
    }

    /* ── Status badge ── */
    .status-row {
      padding: 10px 16px;
      display: flex; align-items: center; gap: 8px;
      background: #2c2f33;
      border-bottom: 1px solid #111315;
    }
    .dot {
      width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0;
      transition: background .3s;
    }
    .dot.idle     { background: #72767d; }
    .dot.running  { background: #43b581; animation: pulse 1.4s infinite; }
    .dot.captcha  { background: #faa61a; animation: pulse 1.4s infinite; }
    .dot.done     { background: #43b581; }
    .dot.error    { background: #ed4245; }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50%       { opacity: .35; }
    }

    #status-text {
      font-size: 12px; color: #b9bbbe; flex: 1;
    }

    /* ── Stats grid ── */
    .stats {
      display: grid; grid-template-columns: 1fr 1fr 1fr;
      gap: 1px; background: #111315;
      border-bottom: 1px solid #111315;
    }
    .stat {
      background: #2c2f33;
      padding: 10px 0;
      text-align: center;
    }
    .stat-value {
      font-size: 18px; font-weight: 700;
      color: #7289da; line-height: 1;
    }
    .stat-label {
      font-size: 9px; color: #72767d;
      text-transform: uppercase; letter-spacing: .5px;
      margin-top: 3px;
    }

    /* ── Progress bar ── */
    .progress-wrap {
      padding: 10px 16px 0;
    }
    .progress-header {
      display: flex; justify-content: space-between;
      font-size: 10px; color: #72767d; margin-bottom: 5px;
    }
    .progress-bar {
      height: 4px; background: #111315; border-radius: 2px; overflow: hidden;
    }
    .progress-fill {
      height: 100%;
      background: linear-gradient(90deg, #7289da, #a78cf0);
      border-radius: 2px;
      width: 0%;
      transition: width .5s ease;
    }

    /* ── Current quest ── */
    .current-quest {
      padding: 8px 16px 0;
      font-size: 11px; color: #72767d;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
      min-height: 22px;
    }
    .current-quest span { color: #b9bbbe; }

    /* ── Log ── */
    .log-wrap {
      margin: 10px 16px 0;
      background: #111315;
      border-radius: 6px;
      overflow: hidden;
    }
    .log-header {
      padding: 5px 10px;
      font-size: 9px; font-weight: 700;
      color: #72767d; text-transform: uppercase; letter-spacing: .6px;
      border-bottom: 1px solid #1e2124;
      display: flex; justify-content: space-between; align-items: center;
    }
    .log-clear {
      font-size: 9px; color: #72767d; cursor: pointer;
      background: none; border: none; padding: 0; color: #72767d;
    }
    .log-clear:hover { color: #b9bbbe; }
    #log-list {
      list-style: none;
      max-height: 100px;
      overflow-y: auto;
      padding: 6px 0;
    }
    #log-list li {
      padding: 2px 10px;
      font-size: 10px; line-height: 1.5;
      color: #72767d;
      display: flex; gap: 6px;
    }
    #log-list li .ts { color: #484c52; flex-shrink: 0; }
    #log-list li.info  .msg { color: #b9bbbe; }
    #log-list li.warn  .msg { color: #faa61a; }
    #log-list li.error .msg { color: #ed4245; }
    #log-list li.good  .msg { color: #43b581; }

    /* ── Controls ── */
    .controls {
      padding: 12px 16px 14px;
      display: flex; gap: 8px;
    }

    .btn {
      flex: 1; padding: 8px 0;
      border: none; border-radius: 5px;
      font-size: 12px; font-weight: 600;
      cursor: pointer; transition: filter .15s, transform .1s;
    }
    .btn:active { transform: scale(.97); }
    .btn:disabled { opacity: .45; cursor: not-allowed; }

    .btn-start {
      background: #7289da; color: #fff;
    }
    .btn-start:hover:not(:disabled) { filter: brightness(1.12); }

    .btn-stop {
      background: #2c2f33; color: #b9bbbe;
      border: 1px solid #3a3d42;
    }
    .btn-stop:hover:not(:disabled) { background: #3a3d42; }

    .btn-open {
      background: #2c2f33; color: #7289da;
      border: 1px solid #3a3d42;
      font-size: 11px;
    }
    .btn-open:hover { background: #3a3d42; }

    /* ── Footer ── */
    .footer {
      padding: 0 16px 12px;
      font-size: 9px; color: #484c52; text-align: center;
    }
  </style>
</head>
<body>

  <!-- Header -->
  <div class="header">
    <div class="orb-icon">⚡</div>
    <div class="header-text">
      <h1>Discord Orb Collector</h1>
      <p>Video quest automation</p>
    </div>
  </div>

  <!-- Status row -->
  <div class="status-row">
    <div class="dot idle" id="dot"></div>
    <span id="status-text">Idle — open discord.com to begin</span>
  </div>

  <!-- Stats -->
  <div class="stats">
    <div class="stat">
      <div class="stat-value" id="stat-done">0</div>
      <div class="stat-label">Claimed</div>
    </div>
    <div class="stat">
      <div class="stat-value" id="stat-queue">0</div>
      <div class="stat-label">Queued</div>
    </div>
    <div class="stat">
      <div class="stat-value" id="stat-orbs">—</div>
      <div class="stat-label">Orbs</div>
    </div>
  </div>

  <!-- Progress bar -->
  <div class="progress-wrap">
    <div class="progress-header">
      <span id="progress-label">No active quest</span>
      <span id="progress-pct"></span>
    </div>
    <div class="progress-bar">
      <div class="progress-fill" id="progress-fill"></div>
    </div>
  </div>

  <!-- Current quest label -->
  <div class="current-quest" id="current-quest"></div>

  <!-- Log -->
  <div class="log-wrap">
    <div class="log-header">
      <span>Activity log</span>
      <button class="log-clear" id="btn-clear-log">clear</button>
    </div>
    <ul id="log-list"></ul>
  </div>

  <!-- Controls -->
  <div class="controls">
    <button class="btn btn-start" id="btn-start">▶ Start</button>
    <button class="btn btn-stop"  id="btn-stop" disabled>■ Stop</button>
    <button class="btn btn-open"  id="btn-open">Open Quests</button>
  </div>

  <!-- Footer -->
  <div class="footer">Runs on discord.com/quest-home · Chrome &amp; Safari</div>

  <script src="popup.js"></script>
</body>
</html>
